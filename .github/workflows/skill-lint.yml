name: Skill lint
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: skill-lint-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  skill-lint:
    uses: valentinyeo/house-rules/.github/workflows/skill-lint.yml@f524508f019ebe6e05d700919f39b929b0bbba92
    with:
      lint-ref: f524508f019ebe6e05d700919f39b929b0bbba92
    secrets: inherit
