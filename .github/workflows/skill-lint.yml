name: Skill lint
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: skill-lint-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  skill-lint:
    uses: valentinyeo/house-rules/.github/workflows/skill-lint.yml@a0f08f2d968629ff76df1f5b4ee5751be8f56cc6
    with:
      lint-ref: a0f08f2d968629ff76df1f5b4ee5751be8f56cc6
    secrets: inherit
