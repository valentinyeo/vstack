name: Skill lint
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: skill-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  skill-lint:
    uses: valentinyeo/house-rules/.github/workflows/skill-lint.yml@35edee8c697e4115febd3fcc5acd4b2026fdff46
    with:
      lint-ref: 35edee8c697e4115febd3fcc5acd4b2026fdff46
    secrets: inherit
