name: Skill lint
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: skill-lint-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  skill-lint:
    uses: valentinyeo/house-rules/.github/workflows/skill-lint.yml@6b3d15a26ecf02760fe39ef75fb8ab7b7235c52d
    with:
      lint-ref: 6b3d15a26ecf02760fe39ef75fb8ab7b7235c52d
    secrets: inherit
