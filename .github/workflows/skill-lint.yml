name: Skill lint
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: skill-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  skill-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned pstack ref
        id: pins
        run: |
          python3 - <<'PY'
          import json, os, re
          pins = json.load(open('.skill-lint.json'))
          ref = pins['pstack-ref']
          assert re.fullmatch('[0-9a-f]{40}', ref), 'pstack-ref: pin a full commit SHA'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'pstack-ref={ref}\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: cursor/plugins
          ref: ${{ steps.pins.outputs.pstack-ref }}
          path: .pstack-source
          persist-credentials: false
      - name: Validate skills per pstack authoring-a-skill.md
        run: python3 scripts/skill-validate.py --pstack .pstack-source/pstack/skills
