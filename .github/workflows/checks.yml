name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every shipped hook reference resolves
        run: timeout 60 python3 scripts/check-hook-paths --repo .
      - name: Fetch pinned pstack
        run: |
          set -euo pipefail
          ref=$(python3 -c 'import json; print(json.load(open(".skill-lint.json"))["pstack-ref"])')
          version=$(python3 -c 'import json; print(json.load(open(".skill-lint.json"))["pstack-version"])')
          git init -q "$RUNNER_TEMP/cursor-plugins"
          git -C "$RUNNER_TEMP/cursor-plugins" remote add origin https://github.com/cursor/plugins
          git -C "$RUNNER_TEMP/cursor-plugins" fetch --quiet --depth 1 origin "$ref"
          git -C "$RUNNER_TEMP/cursor-plugins" checkout --quiet FETCH_HEAD
          mkdir -p "$RUNNER_TEMP/pstack"
          ln -s "$RUNNER_TEMP/cursor-plugins/pstack" "$RUNNER_TEMP/pstack/$version"
          echo "PSTACK_PINNED_DIR=$RUNNER_TEMP/cursor-plugins/pstack" >> "$GITHUB_ENV"
      - run: timeout 900 python3 -m unittest discover -s tests
      - run: python3 -m unittest discover -s tests -p test_verify_reconcile.py -v
      - run: bash tests/install.sh
      - name: No new verification gates
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 skills/pstack-diff/pstack-diff --base "$BASE" --pstack "$RUNNER_TEMP/pstack"

  verify-vstack:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change touch chat wiring?
        id: touched
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE"...HEAD > changed.txt
          if grep -Eq '^(hooks/|install$)|(^|/)settings(\.local)?\.json$|SKILL\.md$' changed.txt; then
            echo 'run=1' >> "$GITHUB_OUTPUT"
          else
            echo 'run=0' >> "$GITHUB_OUTPUT"
          fi
      - name: Install the change into a scratch HOME and check its wiring
        if: steps.touched.outputs.run == '1'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          .claude/skills/verify-vstack/run --no-drive --base "$BASE"

  pacer-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record the PR body and changed files
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          printf '%s\n' "$PR_BODY" > pacer-body.md
          git diff --name-only "origin/$BASE_REF...HEAD" > pacer-changed.txt
      - run: python3 scripts/pacer-check.py --body-file pacer-body.md --changed-files-file pacer-changed.txt
