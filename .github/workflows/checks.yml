name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 -m unittest discover -s tests -p test_verify_reconcile.py -v
      - run: bash tests/install.sh

  pacer-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record the PR body and changed files
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          printf '%s\n' "$PR_BODY" > pacer-body.md
          git diff --name-only "origin/$BASE_REF...HEAD" > pacer-changed.txt
      - run: python3 scripts/pacer-check.py --body-file pacer-body.md --changed-files-file pacer-changed.txt
