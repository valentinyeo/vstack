name: assemble release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: assemble-agent-template-release
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble changelog fragments
        run: python3 templates/agent-skills/create-agent/scripts/assemble-release.py
      - name: Commit the release
        run: |
          if git diff --quiet; then
            echo "No changelog fragments to release."
            exit 0
          fi
          version="$(cat templates/agent-skills/create-agent/VERSION)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add templates/agent-skills/create-agent/VERSION \
            templates/agent-skills/create-agent/CHANGELOG.md \
            templates/agent-skills/create-agent/changelog.d
          git commit -m "release: ${version} [skip ci]"
          git push origin HEAD:main
