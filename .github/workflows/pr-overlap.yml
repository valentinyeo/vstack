name: pr-overlap
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number to check (required when called as a reusable workflow)
        required: false
        type: number
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-overlap-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true
jobs:
  pr-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check for overlap with older open PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          python3 scripts/pr-overlap --repo "${{ github.repository }}" --pr "$PR_NUMBER"