name: up-to-date
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: up-to-date-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  up-to-date:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the PR is built on current main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 scripts/up-to-date --repo "${{ github.repository }}" --pr "$PR_NUMBER"
