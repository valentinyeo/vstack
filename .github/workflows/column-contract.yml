name: Column contract
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: column-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  columns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_board_columns.py -v
      - run: bash tests/install.sh
