name: SOFT-2446 verifier
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: column-verifier-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pstack-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick verifier model
        run: |
          model=$(python3 scripts/pick-verifier-model)
          echo "VERIFIER_MODEL=$model" >> "$GITHUB_ENV"
      - name: Independent verification
        env:
          OPENCODE_API_KEY: ${{ secrets.PSTACK_OPENCODE_API_KEY || secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERIFY_COMMANDS: '["python3 -m unittest discover -s tests -p test_*columns.py -v", "python3 -m unittest discover -s tests -p test_column_verifier.py -v", "bash tests/install.sh"]'
        run: python3 scripts/column-verifier.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soft-2446-verifier-trace
          path: ${{ runner.temp }}/column-verifier
          retention-days: 7
