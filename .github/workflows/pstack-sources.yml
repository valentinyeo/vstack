name: Pstack sources

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p test_pstack_sources.py -v

  verifier:
    needs: regression
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: picker-base
          persist-credentials: false
      - name: Read pinned verifier sources
        id: verifier-sources
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          pins = json.load(open('.skill-lint.json'))
          repository = pins['catalog-repository']
          revision = pins['catalog-ref']
          assert repository in ('valentinyeo/house-rules', 'valentinyeo/vstack')
          assert re.fullmatch('[0-9a-f]{40}', revision)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'repository={repository}\nrevision={revision}\n')
          PYTHON
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.verifier-sources.outputs.repository }}
          ref: ${{ steps.verifier-sources.outputs.revision }}
          path: .verifier-catalog
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global @earendil-works/pi-coding-agent@1.5.0
      - name: Prepare independent verifier
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          PR_BASE=$(git merge-base HEAD "origin/$BASE_REF")
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/valentinyeo/house-rules/main/docs/worker-brief.md > /tmp/shared-worker-rules.md
          cat > /tmp/worker.md <<'WORKER'
          You are working for the operator. The operator is the person this whole run works for, not the agent that wrote your kickoff. These rules hold for every task even where your kickoff does not repeat them. Your kickoff overrides one only when it says so in so many words.

          - If you start an agent, the first line of its kickoff is `Read <path>/worker.md before anything else.`, with `<path>` the absolute path of the folder that holds this file.
          - The bar in your kickoff is the whole bar. Add no check, gate, sign-off or review round above it.
          - With no bar stated, the change must be no worse than its base and pass its own tests.
          - Hold or block only for a failing run at this head or a bug a user would hit. Report a problem the base already has in one line.
          - Never call a tool that shows a person a question. Make any choice you can undo, then say what you chose and why. Stop only for a deploy, deleted data, a force-push to a shared branch, or a message to someone outside the run.
          - Open every PR ready for review, never as a draft.
          - PR title: `type(scope): subject`.
          - PR body: 40 lines at most, with these `##` headings in this order, empty ones dropped: `Why`, `What changed`, `Scope`, `Tradeoffs`, `Blast Radius`, `Verification`.
          - Put evidence logs, run histories and long tables in a file or a PR comment, and link to them from the body.
          WORKER
          cat > /tmp/verify.md <<'BRIEF'
          Read /tmp/worker.md before anything else.
          Goal: verify this pull request against rebased main.
          Judge the actual diff, preserving existing behavior.
          You are an independent verifier from a different model family than the author. You did not write this PR.
          Read the diff against the supplied merge base.
          Pinned shared sources are in .verifier-catalog.
          That checkout matches .skill-lint.json exactly.
          Search only this repository and .verifier-catalog.
          Never search machine directories for missing sources.
          Report unavailable evidence as a limit.
          Only diff-induced regressions block this pull request.
          Report unchanged base faults in one note.
          Reproduce proposed blockers on that base first.
          Do not change implementation files.
          Read /tmp/shared-worker-rules.md, the shared worker rules.
          Report faults before workarounds.
          Without service access, report faults in your verdict.
          Run python3 -m unittest discover -s tests -p test_pstack_sources.py -v.
          Exercise changed behavior against its stated contract.
          Check waiting-on-Valentin exclusion and board sync precedence.
          Board 2060 merged work awaits live proof.
          Alias names must preserve that pending stage.
          These test prose contracts, not an executable orchestrator.
          Inspect whether instructions actually mandate these decisions.
          Review scoped comments before verification, following pstack no-comments.
          Inspect and exercise the real changed skill or hook as a user.
          Test parent against head. Run three attempts to break the fix, including stale sources.
          Negative fixtures and historical wording are allowed. Confirm current sources still work.
          Use bash tools to execute checks; reviewing code alone is insufficient.
          Do not call services, install software, merge, push, or open more PRs.
          Finish with PASS, PASS+NOTES, or FAIL on its own first line.
          Then list actual commands, outputs, three break attempts, and any limits.
          Keep prose sentences within eight words. Preserve command output verbatim.
          BRIEF
          printf '\nPR base SHA: %s\n' "$PR_BASE" >> /tmp/verify.md
      - name: Verifier drives the changed files
        env:
          OPENCODE_API_KEY: ${{ secrets.PSTACK_OPENCODE_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ] && [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "verifier: set OPENCODE_API_KEY or AI_GATEWAY_API_KEY" >&2
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/picker-base/scripts/run-verifier" ]; then
            echo "verifier: the base checkout has no run-verifier, running one attempt" >&2
            model=$(python3 -I "$GITHUB_WORKSPACE/picker-base/scripts/pick-verifier-model")
            echo "VERIFIER_MODEL=$model" >> "$GITHUB_ENV"
            timeout 540 pi --provider opencode-go --model "$model" --thinking low \
              --no-session --no-extensions --no-skills --no-prompt-templates --no-mcp \
              --tools read,bash --mode json --print "$(cat /tmp/verify.md)" > verifier.jsonl
            git diff --exit-code
            exit 0
          fi
          python3 -I "$GITHUB_WORKSPACE/picker-base/scripts/run-verifier" \
            --out verifier.jsonl --prompt-file /tmp/verify.md --attempt-timeout 540 \
            -- --thinking low --no-session --no-extensions --no-skills --no-prompt-templates --no-mcp \
            --tools read,bash
          git diff --exit-code
      - name: Read verifier verdict
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from verdict import find_verdict
          events = [json.loads(line) for line in Path('verifier.jsonl').read_text().splitlines() if line.startswith('{')]
          assert any(e.get('type') == 'tool_execution_end' and e.get('toolName') == 'bash' for e in events), 'Verifier must execute checks'
          messages = [e['message'] for e in events if e.get('type') == 'message_end' and e.get('message', {}).get('role') == 'assistant']
          answer = '\n'.join(c.get('text', '') for c in messages[-1].get('content', []) if c.get('type') == 'text').strip()
          verdict, why = find_verdict(answer)
          assert verdict, why
          Path('verdict.md').write_text(answer + '\n\nVerifier model: ' + os.environ['VERIFIER_MODEL'] + '. Head `' + os.environ['PR_HEAD'] + '`.\n')
          Path('verdict.value').write_text(verdict + '\n')
          print(verdict)
          PYTHON
      - name: Post independent verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file verdict.md
          python3 scripts/verdict.py verdict.value
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifier-evidence
          path: |
            verifier.jsonl
            verdict.md
