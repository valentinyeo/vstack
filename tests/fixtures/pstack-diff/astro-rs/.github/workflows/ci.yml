name: CI

on:
  push:
    branches: [main, site]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_CACHE: local:rw,remote:rw
      TURBO_RUN_SUMMARY: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint every workflow file with actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --silent --show-error --fail --location --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= "${workflow_files[@]}"
      - name: Use Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch pinned source objects
        run: pnpm sources:fetch
      - name: Check and test
        # 6882060, 4 cores/16 GB: median N1=479s, N2=265s, N4=271s; N2 worst test=39.13% of budget.
        run: pnpm turbo run check test build --concurrency=2
      - name: Check install scripts in the build
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path("apps/web/dist/client")
          expected = {
              "install": "a83f0798bf63b0b2c042edda837161c988519f8b39c1f7a823a1ed3a8df1ea26",
              "install.sh": "a83f0798bf63b0b2c042edda837161c988519f8b39c1f7a823a1ed3a8df1ea26",
              "install.ps1": "ce17de828544ae531d263d2be9d8f171fac6905c12af361887d2e33bff0954ea",
          }
          for name, sha256 in expected.items():
              path = root / name
              if not path.is_file():
                  raise SystemExit(f"missing {path}")
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != sha256:
                  raise SystemExit(f"{path} bytes {actual} do not match {sha256}")
          headers = (root / "_headers").read_text()
          for address in ("/install", "/install.sh", "/install.ps1"):
              rule = f"{address}\n  Content-Type: text/plain; charset=utf-8"
              if rule not in headers:
                  raise SystemExit(f"{address} is not served as plain text")
          print("INSTALL_SCRIPTS_OK install install.sh install.ps1")
          PY
      - name: Measure built site
        run: |
          python3 - <<'PY'
          import gzip
          import os
          root = "apps/web/dist"
          if not os.path.isdir(root):
              raise SystemExit(f"missing {root}")
          files = []
          total = 0
          scripts = []
          worker_raw_bytes = 0
          worker_gzip_bytes = 0
          for dirpath, _, names in os.walk(root):
              for name in names:
                  path = os.path.join(dirpath, name)
                  size = os.path.getsize(path)
                  total += size
                  files.append((size, path))
                  if name.endswith((".js", ".mjs")) and os.path.commonpath([path, os.path.join(root, "server")]) == os.path.join(root, "server"):
                      with open(path, "rb") as source:
                          raw = source.read()
                      compressed_size = len(gzip.compress(raw, mtime=0))
                      scripts.append((compressed_size, size, path))
                      worker_raw_bytes += size
                      worker_gzip_bytes += compressed_size
          files.sort(reverse=True)
          scripts.sort(reverse=True)
          print(f"SITE_BYTES {total}")
          if not scripts:
              raise SystemExit("no worker scripts in apps/web/dist/server")
          print(f"WORKER_SCRIPT_BYTES {worker_raw_bytes}")
          print(f"WORKER_GZIP_BYTES {worker_gzip_bytes}")
          print("FREE_PLAN_UNCOMPRESSED_LIMIT_BYTES 67108864")
          print("LIMIT_SOURCE https://developers.cloudflare.com/workers/platform/limits/#worker-size")
          for gzip_bytes, raw_bytes, path in scripts:
              print(f"WORKER_MODULE {raw_bytes} {gzip_bytes} {path}")
          for size, path in files[:30]:
              print(f"{size} {path}")
          if worker_raw_bytes > 67108864:
              raise SystemExit("worker exceeds Cloudflare Free uncompressed size limit")
          PY
      - name: Upload Turbo run summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-runs
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: ignore
